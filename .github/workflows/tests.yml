name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/sync.test.mjs
      - run: cd insights && npm test
      - run: if [ -f cloudflare/package.json ]; then cd cloudflare && npm test; fi
