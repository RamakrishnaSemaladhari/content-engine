name: Daily Research Queue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivecheckmate-daily-research
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          ENGINE_API_URL: ${{ secrets.ENGINE_API_URL }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ENGINE_API_URL}" ]; then
            echo "::error::ENGINE_API_URL is missing or unavailable to this workflow."
            missing=1
          fi
          if [ -z "${ENGINE_API_TOKEN}" ]; then
            echo "::error::ENGINE_API_TOKEN is missing or unavailable to this workflow."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Check Settings > Secrets and variables > Actions > Repository secrets. Names must match exactly. No network request was made."
            exit 1
          fi
          case "$ENGINE_API_URL" in
            https://*) ;;
            *) echo "::error::ENGINE_API_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Create or resume daily job
        env:
          ENGINE_API_URL: ${{ secrets.ENGINE_API_URL }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            --max-time 60 --request POST \
            --header "Authorization: Bearer $ENGINE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"mode":"daily","maxCandidates":40}' \
            "$ENGINE_API_URL/api/run/daily")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Worker returned HTTP $code. Checkpointed job state should remain in D1."
            exit 1
          fi
          echo "Daily job accepted. Response content was not logged."
