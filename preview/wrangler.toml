# Staging UI / visitor blog + /api proxy. No bindings, no secrets.
name = "fivecheckmate-blog-preview"
main = "worker.js"
compatibility_date = "2026-10-18"
workers_dev = true

# Staging diagnostics: persist invocation logs; redact query strings to avoid leaking URL parameters.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
